version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_expressbr
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: expressbr_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_express_data:/var/lib/postgresql/data

volumes:
  postgres_express_data:
